<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ business.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <div class="max-w-3xl mx-auto p-6">
        <a href="javascript:history.back()" class="text-indigo-600 font-medium">&larr; Back</a>
        <div class="bg-white p-6 rounded-xl shadow mt-4 border border-slate-100">
            <h1 class="text-3xl font-bold">{{ business.name }}</h1>
            <p class="text-slate-600 mt-2">📍 <strong>Address:</strong> {{ business.address }}</p>
            <p class="text-slate-600 mt-1">📞 <strong>Phone:</strong> {{ business.phone }}</p>

            {% if business.doctors %}
            <hr class="my-6">
            <h2 class="text-2xl font-bold mb-4">Available Doctors & Specialists</h2>
            <div class="space-y-3">
                {% for doc in business.doctors %}
                <div class="bg-slate-50 p-4 rounded border border-slate-200">
                    <h3 class="font-bold text-lg text-indigo-700">{{ doc.name }}</h3>
                    <p class="text-sm text-slate-600">Specialty: {{ doc.specialty }}</p>
                    <p class="text-sm text-slate-500">Timing: {{ doc.timing }}</p>
                </div>
                {% endfor %}
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
