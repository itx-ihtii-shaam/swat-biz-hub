<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_name }} - Local Business Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">
    <!-- Header -->
    <header class="bg-blue-600 dark:bg-blue-800 text-white shadow-lg transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 py-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide hover:opacity-90 transition">
                <a href="{{ url_for('home') }}">{{ site_name }}</a>
            </h1>
            <div class="flex items-center space-x-4">
                <!-- Dark/Light Mode Toggle Button -->
                <button onclick="toggleDarkMode()" class="bg-blue-700 dark:bg-blue-900 px-3 py-2 rounded-lg text-sm font-medium shadow hover:bg-blue-800 transition transform hover:scale-105">
                    🌓 Theme
                </button>
                <a href="{{ url_for('admin_panel') }}" class="bg-white text-blue-600 dark:bg-gray-800 dark:text-blue-400 px-4 py-2 rounded-lg font-semibold shadow hover:bg-blue-50 dark:hover:bg-gray-700 transition transform hover:-translate-y-0.5">
                    Admin Panel
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-12">
        <div class="text-center mb-12">
            <h2 class="text-4xl font-extrabold mb-4 tracking-tight">Find Trusted Businesses in Swat & Mingora</h2>
            <p class="text-lg text-gray-600 dark:text-gray-400">Explore verified healthcare, restaurants, property dealers, and professional services.</p>
        </div>

        <!-- Categories Grid with Smooth Animations -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            {% for slug, cat in categories.items() %}
            <a href="{{ url_for('category_page', cat_slug=slug) }}" class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-sm hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 hover:scale-102 border border-gray-100 dark:border-gray-700 flex items-center space-x-5 group">
                <span class="text-5xl group-hover:scale-110 transition-transform duration-300">{{ cat.icon }}</span>
                <div>
                    <h3 class="text-xl font-bold group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">{{ cat.title }}</h3>
                    <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Browse listings & details</p>
                </div>
            </a>
            {% endfor %}
        </div>
    </main>

    <script>
        function toggleDarkMode() {
            const root = document.getElementById('html-root');
            root.classList.toggle('dark');
        }
    </script>
</body>
</html>
