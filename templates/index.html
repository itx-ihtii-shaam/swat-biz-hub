<!DOCTYPE html>
<html lang="en" id="html-root" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_name }} - Local Business Directory</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏙️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">
    <!-- Modern Gradient Header -->
    <header class="bg-gradient-to-r from-slate-900 via-blue-950 to-indigo-950 text-white shadow-xl border-b border-blue-900/30">
        <div class="max-w-7xl mx-auto px-4 py-6 flex justify-between items-center">
            <h1 class="text-2xl font-extrabold tracking-wide">
                <a href="{{ url_for('home') }}" class="flex items-center space-x-2">
                    <span>🏙️</span>
                    <span class="bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">{{ site_name }}</span>
                </a>
            </h1>
            <div class="flex items-center space-x-4">
                <button onclick="toggleDarkMode()" class="bg-white/10 hover:bg-white/20 px-3.5 py-2 rounded-xl text-sm font-medium shadow-sm transition transform hover:scale-105 border border-white/10">🌓 Theme</button>
                <a href="{{ url_for('register_business') }}" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl font-semibold shadow-lg shadow-blue-600/20 transition transform hover:-translate-y-0.5">+ List Business</a>
                <a href="{{ url_for('admin_panel') }}" class="bg-white/10 hover:bg-white/20 px-3 py-2 rounded-xl text-sm font-semibold transition">Admin</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-12">
        <div class="text-center max-w-3xl mx-auto mb-12">
            <h2 class="text-4xl md:text-5xl font-extrabold mb-4 tracking-tight">Find Trusted Businesses in Swat & Mingora</h2>
            <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">Search for doctors, hospitals, restaurants, property dealers, and verified local services.</p>
            
            <!-- Interactive Search Box -->
            <div class="relative max-w-2xl mx-auto">
                <input type="text" id="searchInput" onkeyup="filterListings()" placeholder="Search doctors, hospitals, restaurants, specialties..." class="w-full px-6 py-4 rounded-2xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 shadow-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 dark:text-gray-200 placeholder-gray-400 transition-all">
                <span class="absolute right-5 top-4 text-2xl">🔍</span>
            </div>
        </div>

        <!-- Categories Grid with Smooth Animations -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-16">
            {% for slug, cat in categories.items() %}
            <a href="{{ url_for('category_page', cat_slug=slug) }}" class="bg-white dark:bg-gray-900 p-8 rounded-2xl shadow-sm hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 border border-gray-100 dark:border-gray-800 flex items-center space-x-5 group">
                <span class="text-5xl group-hover:scale-110 transition-transform duration-300">{{ cat.icon }}</span>
                <div>
                    <h3 class="text-xl font-bold group-hover:text-blue-500 transition-colors">{{ cat.title }}</h3>
                    <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Browse listings & details</p>
                </div>
            </a>
            {% endfor %}
        </div>
    </main>

    <script>
        function toggleDarkMode() {
            document.getElementById('html-root').classList.toggle('dark');
        }
        function filterListings() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            // Search integration ready
        }
    </script>
</body>
</html>
