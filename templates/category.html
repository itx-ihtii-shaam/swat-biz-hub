<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ category.title }} - {{ site_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <div class="max-w-3xl mx-auto p-6">
        <a href="/" class="text-indigo-600 font-medium">&larr; Back to Home</a>
        <h1 class="text-3xl font-bold mt-4 mb-6">{{ category.icon }} {{ category.title }}</h1>
        <div class="space-y-4">
            {% for biz in businesses %}
            <a href="/business/{{ biz.id }}" class="block bg-white p-5 rounded-lg shadow border border-slate-100 hover:border-indigo-300 transition">
                <h2 class="text-xl font-semibold text-slate-900">{{ biz.name }}</h2>
                <p class="text-slate-500 text-sm mt-1">{{ biz.address }} | {{ biz.phone }}</p>
                {% if biz.status == 'locked' %}
                <span class="inline-block mt-2 text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded">Subscription Expired</span>
                {% endif %}
            </a>
            {% else %}
            <p class="text-slate-500">No businesses listed in this category yet.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
