<!DOCTYPE html>
<html lang="en" id="html-root" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Business - {{ site_name }}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏙️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen">
    <header class="bg-gradient-to-r from-slate-900 via-blue-950 to-indigo-950 text-white shadow-xl">
        <div class="max-w-7xl mx-auto px-4 py-6 flex justify-between items-center">
            <h1 class="text-2xl font-extrabold"><a href="{{ url_for('home') }}" class="hover:opacity-80 transition-opacity">🏙️ {{ site_name }}</a></h1>
            <a href="{{ url_for('home') }}" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl text-sm font-semibold transition transform hover:-translate-y-0.5">← Back to Home</a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-12">
        <div class="bg-white dark:bg-gray-900 p-8 md:p-10 rounded-3xl shadow-2xl border border-gray-100 dark:border-gray-800 transition-all duration-300">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold tracking-tight">Register Your Business</h2>
                <p class="text-gray-500 dark:text-gray-400 mt-2">Get listed on SwatBiz Hub instantly with a 30-day free trial!</p>
            </div>

            <form method="POST" enctype="multipart/form-data" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium mb-2">Business Name</label>
                    <input type="text" name="name" required placeholder="e.g. Al-Shifa Hospital or Rock City Hotel" class="w-full px-4 py-3.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none transition-all duration-200 hover:border-blue-400">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium mb-2">Category</label>
                        <select name="category" id="categorySelect" onchange="toggleDoctorSection()" class="w-full px-4 py-3.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none transition-all duration-200 hover:border-blue-400 cursor-pointer">
                            {% for slug, cat in categories.items() %}
                            <option value="{{ slug }}">{{ cat.title }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Phone Number</label>
                        <input type="text" name="phone" required placeholder="+92 946 XXXXXXX" class="w-full px-4 py-3.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none transition-all duration-200 hover:border-blue-400">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Address / Location</label>
                    <input type="text" name="address" required placeholder="e.g. Hospital Road, Mingora, Swat" class="w-full px-4 py-3.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none transition-all duration-200 hover:border-blue-400">
                </div>

                <!-- Image Upload Section with Smooth Hover -->
                <div class="p-5 bg-gray-50 dark:bg-gray-800/40 rounded-2xl border border-gray-200 dark:border-gray-700 space-y-4 transition-all duration-300 hover:shadow-md">
                    <label class="block text-sm font-bold text-blue-500">Business Photo (Choose File OR Link)</label>
                    <div>
                        <span class="block text-xs text-gray-500 mb-1">Upload Photo directly:</span>
                        <input type="file" name="image_file" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer transition">
                    </div>
                    <div class="text-center text-xs text-gray-400 font-bold">-- OR --</div>
                    <div>
                        <input type="url" name="image_url" placeholder="Paste Image URL (https://images.unsplash.com/...)" class="w-full px-4 py-3 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all duration-200 hover:border-blue-400">
                    </div>
                </div>

                <!-- Doctors Section (Only visible for Hospitals) -->
                <div id="doctorSection" class="p-6 bg-blue-50/50 dark:bg-gray-800/50 rounded-2xl border border-blue-100 dark:border-gray-700 space-y-4 transition-all duration-300">
                    <h3 class="text-lg font-bold text-blue-600 dark:text-blue-400 flex items-center space-x-2"><span>🩺</span> <span>Doctors, Clinic & Timings</span></h3>
                    
                    <div id="doctorList" class="space-y-4">
                        <!-- Initial Doctor Card with soft hover transition -->
                        <div class="doctor-card relative bg-white dark:bg-gray-900 p-5 rounded-2xl border border-gray-200 dark:border-gray-700 space-y-3 transition-all duration-300 hover:shadow-lg hover:-translate-y-0.5">
                            <div class="flex justify-between items-center border-b border-gray-100 dark:border-gray-800 pb-2">
                                <span class="text-xs font-bold text-blue-500 uppercase tracking-wider">Doctor Details</span>
                                <button type="button" onclick="confirmDelete(this)" class="text-red-500 hover:text-red-700 text-xs font-bold flex items-center space-x-1 bg-red-50 dark:bg-red-900/30 px-2.5 py-1 rounded-lg transition transform hover:scale-105">
                                    <span>❌</span> <span>Remove</span>
                                </button>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <input type="text" name="doc_name[]" placeholder="Doctor Name (Dr. Ahmad)" class="px-3.5 py-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all hover:border-blue-400">
                                <input type="text" name="doc_spec[]" placeholder="Specialty (Cardiologist)" class="px-3.5 py-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all hover:border-blue-400">
                                <input type="text" name="doc_app_time[]" placeholder="Appointment Timing (9 AM - 2 PM)" class="px-3.5 py-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all hover:border-blue-400">
                                <input type="text" name="doc_clinic_time[]" placeholder="Clinic Timing (Mon-Sat, 9 AM - 5 PM)" class="px-3.5 py-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all hover:border-blue-400">
                                <input type="text" name="doc_clinic[]" placeholder="Clinic / Room (Room 12, OPD Block)" class="px-3.5 py-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all hover:border-blue-400 md:col-span-2">
                            </div>
                        </div>
                    </div>

                    <button type="button" onclick="addDoctorField()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition transform hover:-translate-y-0.5 hover:shadow-md flex items-center space-x-2">
                        <span>+</span> <span>Add Another Doctor</span>
                    </button>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-4 rounded-2xl shadow-xl hover:opacity-95 transition transform hover:-translate-y-0.5 text-lg">Submit & Activate Free Listing</button>
            </form>
        </div>
    </main>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 transition-opacity">
        <div class="bg-white dark:bg-gray-900 rounded-3xl p-6 max-w-sm w-full border border-gray-100 dark:border-gray-800 shadow-2xl text-center space-y-4 transform transition-all scale-100">
            <div class="text-4xl">⚠️</div>
            <h3 class="text-xl font-bold">Remove Doctor?</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400">Are you sure you want to delete this doctor's information?</p>
            <div class="flex space-x-3 pt-2">
                <button type="button" onclick="closeModal()" class="w-1/2 bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-gray-200 py-2.5 rounded-xl font-semibold hover:bg-gray-300 dark:hover:bg-gray-700 transition">Cancel</button>
                <button type="button" id="confirmDeleteBtn" class="w-1/2 bg-red-600 hover:bg-red-500 text-white py-2.5 rounded-xl font-semibold shadow-lg transition transform hover:scale-102">Yes, Delete</button>
            </div>
        </div>
    </div>

    <script>
        let targetDoctorCard = null;

        function toggleDoctorSection() {
            const cat = document.getElementById('categorySelect').value;
            const docSec = document.getElementById('doctorSection');
            docSec.style.display = (cat === 'hospitals') ? 'block' : 'none';
        }

        function addDoctorField() {
            const list = document.getElementById('doctorList');
            const div = document.createElement('div');
            div.className = "doctor-card relative bg-white dark:bg-gray-900 p-5 rounded-2xl border border-gray-200 dark:border-gray-700 space-y-3 transition-all duration-300 hover:shadow-lg hover:-translate-y-0.5";
            div.innerHTML = `
                <div class="flex justify-between items-center border-b border-gray-100 dark:border-gray-800 pb-2">
                    <span class="text-xs font-bold text-blue-500 uppercase tracking-wider">Doctor Details</span>
                    <button type="button" onclick="confirmDelete(this)" class="text-red-500 hover:text-red-700 text-xs font-bold flex items-center space-x-1 bg-red-50 dark:bg-red-900/30 px-2.5 py-1 rounded-lg transition transform hover:scale-105">
                        <span>❌</span> <span>Remove</span>
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input type="text" name="doc_name[]" placeholder="Doctor Name" class="px-3.5 py-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all hover:border-blue-400">
                    <input type="text" name="doc_spec[]" placeholder="Specialty" class="px-3.5 py-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all hover:border-blue-400">
                    <input type="text" name="doc_app_time[]" placeholder="Appointment Timing" class="px-3.5 py-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all hover:border-blue-400">
                    <input type="text" name="doc_clinic_time[]" placeholder="Clinic Timing (Days & Hours)" class="px-3.5 py-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all hover:border-blue-400">
                    <input type="text" name="doc_clinic[]" placeholder="Clinic / Room" class="px-3.5 py-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all hover:border-blue-400 md:col-span-2">
                </div>
            `;
            list.appendChild(div);
        }

        function confirmDelete(btn) {
            targetDoctorCard = btn.closest('.doctor-card');
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function closeModal() {
            targetDoctorCard = null;
            document.getElementById('deleteModal').classList.add('hidden');
        }

        document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
            if (targetDoctorCard) {
                targetDoctorCard.remove();
            }
            closeModal();
        });

        toggleDoctorSection();
    </script>
</body>
</html>
